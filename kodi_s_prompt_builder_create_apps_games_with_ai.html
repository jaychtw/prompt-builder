<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kodi's Prompt Builder — Create Apps & Games with AI</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap');

    :root {
      --bg-cream: #FDF6F0;
      --bg-kodi: #FBEEE5;
      --ink-dark: #2C1E14;
      --ink-muted: #6B5749;
      --olive: #556B3A;
      --olive-light: #EAF0E1;
      --honey: #C9762D;
      --honey-light: #FDEFE2;
      --card-border: #E8D9CB;
    }

    html {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-cream);
      color: var(--ink-dark);
      scroll-behavior: smooth;
    }

    html.large-text {
      font-size: 18.5px;
    }

    h1, h2, h3, .font-display {
      font-family: 'Nunito', 'Inter', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(201, 118, 45, 0.08) 0%, transparent 38%),
        radial-gradient(circle at 88% 85%, rgba(85, 107, 58, 0.09) 0%, transparent 42%);
      min-height: 100vh;
    }

    /* Kodi animations */
    @keyframes kodiFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes kodiPopIn {
      0% { opacity: 0; transform: scale(0.88) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes gentleNudge {
      0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(85, 107, 58, 0.12); }
      50% { transform: scale(1.025); box-shadow: 0 10px 28px rgba(201, 118, 45, 0.25); }
    }

    @keyframes cardEnter {
      0% { opacity: 0; transform: translateY(14px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .animate-kodi-float {
      animation: kodiFloat 4s ease-in-out infinite;
    }

    .animate-pop-in {
      animation: kodiPopIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-card-enter {
      animation: cardEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-nudge {
      animation: gentleNudge 1.2s ease-in-out 2;
    }

    /* Speech bubble tail */
    .speech-bubble {
      position: relative;
      background: #FFFFFF;
      border: 2px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(44, 30, 20, 0.06);
    }

    .choice-card {
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.2s ease,
                  border-color 0.2s ease,
                  background-color 0.2s ease;
    }

    .choice-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(44, 30, 20, 0.09);
    }

    .choice-card:active {
      transform: translateY(0px) scale(0.99);
    }

    .choice-card.selected {
      border-color: var(--olive);
      background-color: #F4F8EE;
      box-shadow: 0 0 0 3px rgba(85, 107, 58, 0.18);
    }

    .choice-card.selected-game {
      border-color: var(--honey);
      background-color: #FFF6ED;
      box-shadow: 0 0 0 3px rgba(201, 118, 45, 0.20);
    }

    .kodi-frame {
      background-color: #FBEEE5;
    }

    /* Focus rings for keyboard & elder accessibility */
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid #C9762D;
      outline-offset: 2px;
    }
  </style>
</head>

      if (idleTimerId !== null) {

        idleTimerId = null;
      }
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      state.speaking = false;
      updateSpeakButtons();
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        showToast(state.lang === "zh" ? "此瀏覽器不支援語音朗讀" : "Read-aloud isn't supported in this browser");
        return;
      }
      if (state.speaking) {
        stopSpeech();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = state.lang === "zh" ? "zh-TW" : "en-US";
        utter.rate = 0.95;
        utter.onend = () => {
          state.speaking = false;
          updateSpeakButtons();
        };
        utter.onerror = () => {
          state.speaking = false;
          updateSpeakButtons();
        };
        state.speaking = true;
        updateSpeakButtons();
        window.speechSynthesis.speak(utter);
      } catch (e) {
        state.speaking = false;
        updateSpeakButtons();
      }
    }

    function updateSpeakButtons() {
      document.querySelectorAll("[data-speak-btn]").forEach(btn => {
        const lbl = btn.querySelector("span");
        if (lbl) lbl.textContent = state.speaking ? t().stopReading : t().readAloud;
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      const textEl = document.getElementById("toast-msg");
      if (!el || !textEl) return;
      textEl.textContent = msg;
      el.classList.remove("opacity-0", "translate-y-3");
      el.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add("opacity-0", "translate-y-3");
        el.classList.remove("opacity-100", "translate-y-0");
      }, 2800);
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(t().copied);
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast(t().copied);
      } catch (e) {
        showToast(state.lang === "zh" ? "請手動選取並複製文字" : "Please select and copy the text manually");
      }
      document.body.removeChild(ta);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

            sections.push(`# 創作任務：打造有趣的網頁互動遊戲\n請擔任一位擅長製作親切、好玩小遊戲的創意遊戲設計師與前端工程師，為我打造一款完整可玩的瀏覽器遊戲。`);
            sections.push(`## 1. 遊戲類型與核心體驗\n請製作：${genreLine}。`);
            if (themeLine) {
              sections.push(`## 2. 世界觀與主題\n遊戲背景設定在：${themeLine}。`);
            }
            if (rulesSelected.length) {
              sections.push(`## 3. 操作方式與遊戲規則\n${rulesSelected.map(r => `- ${r}`).join("\n")}`);
            }
            if (styleSelected.length) {
              sections.push(`## 4. 視覺美術與氛圍\n採用${styleSelected[0]}，搭配流暢回饋與清楚的開始畫面、計分與重新開始按鈕。`);
            }
            if (extrasSelected.length) {
              sections.push(`## 5. 難度設計與驚喜彩蛋\n${extrasSelected.map(e => `- ${e}`).join("\n")}`);
            }
            sections.push(`## 6. 技術與交付要求\n- 輸出為單一、獨立可執行的 HTML 檔案，打開即可直接遊玩。\n- 請完整實作遊戲邏輯、勝負判定與「再玩一次」重置功能，不依賴外部圖片檔案。\n- 畫面自動適配電腦與手機／平板螢幕，按鈕大而好按。`);
            return sections.join("\n\n");
          } else {
            let sections = [];
            sections.push(`# Creation Goal: Build a Playable Interactive Web Game\nAct as a joyful indie game designer and web developer. Please build a complete, immediately playable browser game using the blueprint below.`);
            sections.push(`## 1. Game Concept & Experience\nCreate ${genreLine}.`);
            if (themeLine) {
              sections.push(`## 2. World & Theme\nSet the game in ${themeLine}.`);
            }
            if (rulesSelected.length) {
              sections.push(`## 3. Controls & Gameplay Rules\n${rulesSelected.map(r => `- ${r}`).join("\n")}`);
            }
            if (styleSelected.length) {
              sections.push(`## 4. Art Direction & Atmosphere\nUse ${styleSelected[0]}. Include a welcoming title screen, clear visual feedback, and an easy Play Again button.`);
            }
            if (extrasSelected.length) {
              sections.push(`## 5. Difficulty & Special Magic\n${extrasSelected.map(e => `- ${e}`).join("\n")}`);
            }
            sections.push(`## 6. Technical & Delivery Guidelines\n- Deliver everything in a single, self-contained HTML file with no external image files required.\n- Make the game 100% playable from start to finish with clean win/restart states.\n- Ensure responsive layout and comfortable touch + keyboard controls for all ages.`);
            return sections.join("\n\n");
          }
        }
      }
    }

    // =========================================================================
    // HEADER & GLOBAL UI UPDATES
    // =========================================================================
    function updateHeader() {
      const d = t();
      document.getElementById("brand-title").textContent = d.brandTitle;
      document.getElementById("brand-sub").textContent = d.brandSub;
      document.getElementById("label-peek").textContent = d.peekPrompt;
      document.getElementById("label-lang").textContent = d.langSwitch;
      document.getElementById("label-text-size").textContent = state.largeText ? "A-" : "A+";
      document.getElementById("modal-title").textContent = d.modalTitle;
      document.getElementById("modal-desc").textContent = d.modalDesc;
      document.getElementById("label-modal-copy").textContent = d.copyNow;

      const peekBtn = document.getElementById("btn-preview-toggle");
      if (state.screen === "builder") {
        peekBtn.classList.remove("hidden");
        peekBtn.classList.add("flex");
      } else {
        peekBtn.classList.add("hidden");
        peekBtn.classList.remove("flex");
      }
    }

    // =========================================================================
    // RENDERERS
    // =========================================================================
    function render() {
      clearIdleTimer();
      stopSpeech();
      updateHeader();

      const stage = document.getElementById("app-stage");
      if (state.screen === "intro") {
        renderIntro(stage);
      } else if (state.screen === "choice") {
        renderChoice(stage);
      } else if (state.screen === "builder") {
        renderBuilder(stage);
      } else if (state.screen === "result") {
        renderResult(stage);
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

                <div class="w-20 h-20 rounded-3xl bg-[#FDEFE2] text-[#C9762D] flex items-center justify-center mb-5 group-hover:scale-110 transition-transform">

      document.getElementById("btn-choice-speak").addEventListener("click", () => {

      // Gentle 5-second Kodi nudge if user hasn't clicked yet
      idleTimerId = setInterval(() => {
        const bubble = document.getElementById("choice-bubble");

          clearIdleTimer();
          return;
        }
        state.idleNudgeShown = !state.idleNudgeShown;
        speechEl.textContent = state.idleNudgeShown ? t().choiceNudge : t().choiceSpeech;
        bubble.classList.remove("animate-nudge");
        void bubble.offsetWidth;
        bubble.classList.add("animate-nudge");
      }, 5000);

    function selectType(type) {
      clearIdleTimer();
      state.type = type;
      state.stepIndex = 0;
      state.screen = "builder";
      state.customEditedPrompt = null;
      render();
    }

    // --- SCREEN 2: STEP-BY-STEP BUILDER ---
    function renderBuilder(stage) {
      const d = t();
      const steps = getSteps();
      const step = steps[state.stepIndex];
      const isGame = state.type === "game";
      const accentBg = isGame ? "bg-[#C9762D] hover:bg-[#B26421]" : "bg-[#556B3A] hover:bg-[#46592F]";
      const accentBar = isGame ? "bg-[#C9762D]" : "bg-[#556B3A]";
      const accentBadge = isGame ? "bg-[#FDEFE2] text-[#C9762D]" : "bg-[#EAF0E1] text-[#556B3A]";
      const selectedClass = isGame ? "selected-game" : "selected";
      const kodiAvatar = step.kodiPose === "think" ? KODI_IMG.think : KODI_IMG.smile;

      const selectedIds = state.answers[step.id] || [];
      const textKey = step.id + "Text";
      const textVal = state.answers[textKey] || "";
      const progressPct = Math.round(((state.stepIndex + 1) / steps.length) * 100);
      const isLast = state.stepIndex === steps.length - 1;

      const optionsHtml = step.options.map(opt => {
        const isSelected = selectedIds.includes(opt.id);
        let visualBadge = "";
        if (opt.swatch) {
          visualBadge = `
            <div class="flex items-center gap-1.5 mb-2.5">
              ${opt.swatch.map(c => `<span class="w-6 h-6 rounded-full border border-black/10 shadow-sm" style="background:${c}"></span>`).join("")}
            </div>
          `;
        } else {
          visualBadge = `
            <div class="w-11 h-11 rounded-2xl ${isSelected ? (isGame ? 'bg-[#C9762D] text-white' : 'bg-[#556B3A] text-white') : (isGame ? 'bg-[#FDEFE2] text-[#C9762D]' : 'bg-[#EAF0E1] text-[#556B3A]')} flex items-center justify-center mb-3 transition-colors">
              <i data-lucide="${opt.icon}" class="w-5 h-5"></i>
            </div>
          `;
        }

        return `
          <button type="button" data-option-id="${opt.id}" class="choice-card text-left bg-white border-2 border-[#E8D9CB] rounded-2xl p-4 sm:p-5 flex flex-col justify-between relative ${isSelected ? selectedClass : ''}">
            ${isSelected ? `
              <span class="absolute top-3.5 right-3.5 w-6 h-6 rounded-full ${isGame ? 'bg-[#C9762D]' : 'bg-[#556B3A]'} text-white flex items-center justify-center">
                <i data-lucide="check" class="w-3.5 h-3.5"></i>
              </span>
            ` : ""}
            <div>
              ${visualBadge}
              <div class="font-display font-extrabold text-base sm:text-lg text-[#2C1E14] leading-snug pr-6">${escapeHtml(opt.title)}</div>
              <p class="text-xs sm:text-sm text-[#6B5749] mt-1 leading-relaxed">${escapeHtml(opt.desc)}</p>
            </div>
          </button>
        `;
      }).join("");

      const inputHtml = step.inputLabel ? `
        <div class="mt-5 bg-white border-2 border-[#E8D9CB] rounded-2xl p-4 sm:p-5">
          <label for="step-text-input" class="block font-display font-bold text-sm sm:text-base text-[#2C1E14] mb-2">
            ${escapeHtml(step.inputLabel)}
          </label>
          <textarea id="step-text-input" rows="2" placeholder="${escapeHtml(step.inputPlaceholder)}" class="w-full rounded-xl border border-[#E8D9CB] bg-[#FDF6F0]/60 px-4 py-3 text-sm sm:text-base text-[#2C1E14] placeholder:text-[#9A8576] resize-none">${escapeHtml(textVal)}</textarea>
        </div>
      ` : "";

      // Stepper dots
      const stepDotsHtml = steps.map((s, idx) => {
        const isCurrent = idx === state.stepIndex;
        const isDone = idx < state.stepIndex;
        return `
          <button type="button" data-jump-step="${idx}" title="${escapeHtml(s.title)}" class="h-2.5 rounded-full transition-all ${isCurrent ? `w-8 ${accentBar}` : isDone ? `w-3 ${accentBar} opacity-50 hover:opacity-90` : 'w-3 bg-[#E3D3C4] hover:bg-[#D0BAA6]'}"></button>
        `;
      }).join("");

      stage.innerHTML = `
        <section class="w-full max-w-4xl mx-auto animate-card-enter">
          <!-- Top Progress Row -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <div class="flex items-center gap-2.5">
              <span class="px-3 py-1 rounded-full text-xs sm:text-sm font-extrabold ${accentBadge}">
                ${escapeHtml(isGame ? d.cardGameTitle : d.cardAppTitle)}
              </span>
              <span class="text-xs sm:text-sm font-bold text-[#6B5749]">
                ${escapeHtml(d.stepOf(state.stepIndex + 1, steps.length))}
              </span>
            </div>
            <div class="flex items-center gap-2" aria-label="Progress">
              ${stepDotsHtml}
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="w-full h-2 bg-[#EADCD0] rounded-full overflow-hidden mb-6">
            <div class="h-full ${accentBar} rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
          </div>

          <!-- Kodi Guidance Banner -->
          <div class="flex items-start gap-3.5 sm:gap-5 mb-6">
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden border-3 border-white shadow-md kodi-frame shrink-0">
              <img src="${kodiAvatar}" alt="Kodi" class="w-full h-full object-cover" />
            </div>
            <div class="speech-bubble rounded-2xl p-4 sm:p-5 flex-1">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="font-display font-extrabold text-xs uppercase tracking-wider text-[#C9762D]">Kodi</span>
                <button id="btn-step-speak" data-speak-btn type="button" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-[#FDF6F0] hover:bg-[#F5E8DC] text-[#556B3A] border border-[#E8D9CB]">
                  <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                  <span>${escapeHtml(d.readAloud)}</span>
                </button>
              </div>
              <p class="text-sm sm:text-base text-[#2C1E14] leading-relaxed font-medium">
                ${escapeHtml(step.speech)}
              </p>
            </div>
          </div>

          <!-- Step Heading -->
          <div class="mb-5">
            <h1 class="font-display font-black text-2xl sm:text-3xl text-[#2C1E14]">${escapeHtml(step.title)}</h1>
            <p class="text-sm sm:text-base text-[#6B5749] mt-1">${escapeHtml(step.subtitle)}</p>
          </div>

          <!-- Options Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-4">
            ${optionsHtml}
          </div>

          ${inputHtml}

          <!-- Bottom Navigation -->
          <div class="mt-8 pt-4 border-t border-[#E8D9CB] flex items-center justify-between gap-3">
            <button id="btn-prev-step" type="button" class="inline-flex items-center gap-2 px-5 py-3 rounded-xl font-bold text-[#6B5749] bg-white border border-[#E8D9CB] hover:bg-[#F5E8DC] transition-colors">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>${escapeHtml(d.back)}</span>
            </button>

            <button id="btn-next-step" type="button" class="inline-flex items-center gap-2 px-6 sm:px-8 py-3.5 rounded-xl font-display font-extrabold text-base sm:text-lg text-white ${accentBg} shadow-md hover:shadow-lg transition-all active:scale-95">
              <span>${escapeHtml(isLast ? d.finish : d.next)}</span>
              <i data-lucide="${isLast ? 'sparkles' : 'arrow-right'}" class="w-5 h-5"></i>
            </button>
          </div>
        </section>
      `;

      // Bind speech
      document.getElementById("btn-step-speak").addEventListener("click", () => {
        speakText(`${step.speech} ${step.title}`);
      });

      // Bind option clicks
      stage.querySelectorAll("[data-option-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          const optId = btn.getAttribute("data-option-id");
          const current = state.answers[step.id] || [];
          if (step.multi) {
            if (current.includes(optId)) {
              state.answers[step.id] = current.filter(id => id !== optId);
            } else {
              state.answers[step.id] = [...current, optId];
            }
          } else {
            state.answers[step.id] = current.includes(optId) ? [] : [optId];
            // On Step 1 (goal/genre), gently populate text preview if user hasn't typed custom text
            if (step.id === "goal" || step.id === "genre") {
              const optObj = step.options.find(o => o.id === optId);
              if (optObj && state.answers[step.id].length > 0) {
                state.answers[step.id + "Text"] = optObj.promptText;
              }
            }
          }
          state.customEditedPrompt = null;
          render();
        });
      });

      // Bind text input
      const textInput = document.getElementById("step-text-input");
      if (textInput) {
        textInput.addEventListener("input", (e) => {
          state.answers[textKey] = e.target.value;
          state.customEditedPrompt = null;
        });
      }

      // Bind step jump dots
      stage.querySelectorAll("[data-jump-step]").forEach(dot => {
        dot.addEventListener("click", () => {
          const idx = Number(dot.getAttribute("data-jump-step"));
          if (!Number.isNaN(idx) && idx >= 0 && idx < steps.length) {
            state.stepIndex = idx;
            render();
          }
        });
      });

      // Bind Prev / Next
      document.getElementById("btn-prev-step").addEventListener("click", () => {
        if (state.stepIndex === 0) {
          state.screen = "choice";
        } else {
          state.stepIndex -= 1;
        }
        render();
      });

      document.getElementById("btn-next-step").addEventListener("click", () => {
        // Gentle validation on Step 1 only so the prompt always has a core idea
        if (state.stepIndex === 0) {
          const hasSelection = (state.answers[step.id] || []).length > 0;
          const hasText = (state.answers[textKey] || "").trim().length > 0;
          if (!hasSelection && !hasText) {
            showToast(d.needOneChoice);
            return;
          }
        }
        if (isLast) {
          state.screen = "result";
          render();
          fireConfetti();
        } else {
          state.stepIndex += 1;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    }

    function fireConfetti() {
      if (typeof window.confetti === "function") {
        try {
          window.confetti({
            particleCount: 70,
            spread: 68,
            origin: { y: 0.6 },
            colors: ["#556B3A", "#C9762D", "#F59E0B", "#3B82F6", "#EF4444"]
          });
        } catch (e) {}
      }
    }

    // --- SCREEN 3: FINAL READY-TO-COPY PROMPT ---
    function renderResult(stage) {
      const d = t();
      const promptValue = state.customEditedPrompt !== null ? state.customEditedPrompt : buildPromptText(state.promptMode);
      const isSimple = state.promptMode === "simple";

      stage.innerHTML = `
        <section class="w-full max-w-4xl mx-auto animate-pop-in">
          <!-- Celebration Header with Kodi -->
          <div class="flex flex-col sm:flex-row items-center gap-5 mb-6">
            <div class="w-28 h-32 sm:w-32 sm:h-36 rounded-3xl overflow-hidden border-4 border-white shadow-lg kodi-frame shrink-0 animate-kodi-float">
              <img src="${KODI_IMG.full}" alt="Kodi Celebrating" class="w-full h-full object-contain" />
            </div>
            <div class="speech-bubble rounded-3xl p-5 sm:p-6 flex-1 w-full">
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="font-display font-extrabold text-xs uppercase tracking-wider text-[#C9762D]">Kodi</span>
                <button id="btn-result-speak" data-speak-btn type="button" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-[#FDF6F0] hover:bg-[#F5E8DC] text-[#556B3A] border border-[#E8D9CB]">
                  <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                  <span>${escapeHtml(d.readAloud)}</span>
                </button>
              </div>
              <p class="text-base sm:text-lg font-semibold text-[#2C1E14] leading-relaxed">
                ${escapeHtml(d.resultSpeech)}
              </p>
            </div>
          </div>

          <!-- Prompt Card -->
          <div class="bg-white border-2 border-[#E8D9CB] rounded-3xl shadow-lg overflow-hidden mb-6">
            <div class="px-5 sm:px-6 py-4 bg-[#FDF6F0] border-b border-[#E8D9CB] flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2">
                <i data-lucide="sparkles" class="w-5 h-5 text-[#C9762D]"></i>
                <h1 class="font-display font-black text-lg sm:text-xl text-[#2C1E14]">${escapeHtml(d.resultTitle)}</h1>
              </div>

              <!-- Simple vs Detailed Toggle -->
              <div class="inline-flex rounded-xl bg-[#EADCD0]/60 p-1">
                <button id="btn-mode-simple" type="button" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${isSimple ? 'bg-white text-[#2C1E14] shadow-sm' : 'text-[#6B5749] hover:text-[#2C1E14]'}">
                  ${escapeHtml(d.modeSimple)}
                </button>
                <button id="btn-mode-detailed" type="button" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${!isSimple ? 'bg-white text-[#2C1E14] shadow-sm' : 'text-[#6B5749] hover:text-[#2C1E14]'}">
                  ${escapeHtml(d.modeDetailed)}
                </button>
              </div>
            </div>

            <div class="p-5 sm:p-6">
              <textarea id="final-prompt-box" rows="12" class="w-full rounded-2xl border border-[#E8D9CB] bg-[#FDF6F0]/50 p-4 sm:p-5 text-sm sm:text-base leading-relaxed text-[#2C1E14] font-sans">${escapeHtml(promptValue)}</textarea>

              <!-- Big Action Buttons -->
              <div class="mt-5 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <button id="btn-copy-main" type="button" class="flex-1 inline-flex items-center justify-center gap-2.5 px-6 py-4 rounded-2xl font-display font-extrabold text-lg text-white bg-[#556B3A] hover:bg-[#46592F] shadow-md hover:shadow-lg transition-all active:scale-95">
                  <i data-lucide="copy" class="w-5 h-5"></i>
                  <span id="label-copy-main">${escapeHtml(d.copyBtn)}</span>
                </button>

                <button id="btn-edit-steps" type="button" class="inline-flex items-center justify-center gap-2 px-5 py-4 rounded-2xl font-bold text-[#2C1E14] bg-white border-2 border-[#E8D9CB] hover:bg-[#F5E8DC] transition-colors">
                  <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                  <span>${escapeHtml(d.editSteps)}</span>
                </button>

                <button id="btn-start-over" type="button" class="inline-flex items-center justify-center gap-2 px-5 py-4 rounded-2xl font-bold text-[#C9762D] bg-[#FDEFE2] hover:bg-[#FADEC4] transition-colors">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  <span>${escapeHtml(d.startOver)}</span>
                </button>
              </div>
            </div>
          </div>

          <!-- 3-Step Next Guide -->
          <div class="bg-[#EAF0E1]/70 border border-[#D4E0C5] rounded-3xl p-5 sm:p-6">
            <h2 class="font-display font-extrabold text-base sm:text-lg text-[#556B3A] mb-3.5">${escapeHtml(d.nextStepsTitle)}</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              <div class="bg-white/90 rounded-2xl p-4 flex items-start gap-3 border border-[#D4E0C5]">
                <span class="w-7 h-7 rounded-full bg-[#556B3A] text-white font-display font-black text-sm flex items-center justify-center shrink-0">1</span>
                <p class="text-sm text-[#2C1E14] leading-snug">${escapeHtml(d.nextStep1)}</p>
              </div>
              <div class="bg-white/90 rounded-2xl p-4 flex items-start gap-3 border border-[#D4E0C5]">
                <span class="w-7 h-7 rounded-full bg-[#556B3A] text-white font-display font-black text-sm flex items-center justify-center shrink-0">2</span>
                <p class="text-sm text-[#2C1E14] leading-snug">${escapeHtml(d.nextStep2)}</p>
              </div>
              <div class="bg-white/90 rounded-2xl p-4 flex items-start gap-3 border border-[#D4E0C5]">
                <span class="w-7 h-7 rounded-full bg-[#556B3A] text-white font-display font-black text-sm flex items-center justify-center shrink-0">3</span>
                <p class="text-sm text-[#2C1E14] leading-snug">${escapeHtml(d.nextStep3)}</p>
              </div>
            </div>
          </div>
        </section>
      `;

      const promptBox = document.getElementById("final-prompt-box");
      promptBox.addEventListener("input", (e) => {
        state.customEditedPrompt = e.target.value;
      });

      document.getElementById("btn-result-speak").addEventListener("click", () => {
        speakText(d.resultSpeech);
      });

      document.getElementById("btn-mode-simple").addEventListener("click", () => {
        state.promptMode = "simple";
        state.customEditedPrompt = null;
        render();
      });

      document.getElementById("btn-mode-detailed").addEventListener("click", () => {
        state.promptMode = "detailed";
        state.customEditedPrompt = null;
        render();
      });

      document.getElementById("btn-copy-main").addEventListener("click", () => {
        copyTextToClipboard(promptBox.value);
        const lbl = document.getElementById("label-copy-main");
        if (lbl) {
          lbl.textContent = d.copiedBtn;
          setTimeout(() => {
            if (document.getElementById("label-copy-main")) {
              document.getElementById("label-copy-main").textContent = t().copyBtn;
            }
          }, 2200);
        }
      });

      document.getElementById("btn-edit-steps").addEventListener("click", () => {
        state.screen = "builder";
        state.stepIndex = 0;
        render();
      });

      document.getElementById("btn-start-over").addEventListener("click", resetAll);
    }

    function resetAll() {
      state.screen = "choice";
      state.type = null;
      state.stepIndex = 0;
      state.customEditedPrompt = null;
      state.answers = {
        goal: [], goalText: "", audience: [], features: [], featuresText: "",
        style: [], extras: [], extrasText: "",
        genre: [], genreText: "", theme: [], themeText: "", rules: [], rulesText: ""
      };
      showToast(t().resetConfirm);
      render();
    }

    // =========================================================================
    // MODAL & GLOBAL LISTENERS
    // =========================================================================
    function openPreviewModal() {
      const modal = document.getElementById("preview-modal");
      const textEl = document.getElementById("modal-prompt-text");
      textEl.textContent = buildPromptText(state.promptMode);
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closePreviewModal() {
      const modal = document.getElementById("preview-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    document.getElementById("btn-home").addEventListener("click", () => {
      state.screen = "intro";
      render();
    });

    document.getElementById("btn-lang").addEventListener("click", () => {
      state.lang = state.lang === "en" ? "zh" : "en";
      state.customEditedPrompt = null;
      try { localStorage.setItem("kodi_pb_lang", state.lang); } catch (e) {}
      render();
    });

    document.getElementById("btn-text-size").addEventListener("click", () => {
      state.largeText = !state.largeText;
      document.documentElement.classList.toggle("large-text", state.largeText);
      try { localStorage.setItem("kodi_pb_large", state.largeText ? "1" : "0"); } catch (e) {}
      updateHeader();
    });

    document.getElementById("btn-preview-toggle").addEventListener("click", openPreviewModal);
    document.getElementById("btn-close-modal").addEventListener("click", closePreviewModal);
    document.getElementById("preview-modal").addEventListener("click", (e) => {
      if (e.target.id === "preview-modal") closePreviewModal();
    });
    document.getElementById("btn-modal-copy").addEventListener("click", () => {
      const text = document.getElementById("modal-prompt-text").textContent;
      copyTextToClipboard(text);
    });

    // Initial boot
    window.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
